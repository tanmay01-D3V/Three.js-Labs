<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Three.js Project</title>
    <style>body { margin: 0; }</style>
    <!-- Map the bare "three" import in script.js to the local ES module. -->
    <script type="importmap">
    {
        "imports": {
            "three": "./three.module.js"
        }
    }
    </script>
</head>
<body>
    <!-- type="module" enables ES imports used by the Three.js lesson. -->
    <script type="module" src="script.js"></script>
</body>
</html>
